[package]
name = "wtfps"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
prost = "0.14.1"
reqwest = { version = "0.12.24", features = ["gzip"] }
h3o = { version = "0.9.3" }
clap = { version = "4.5.50", features = ["derive"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
futures = "0.3.31"
tryhard = "0.5.2"
#serde = { version = "1.0.204", features = ["derive"] }
env_logger = "0.11.8"
log = "0.4.28"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "macros", "mac_address"] }
dotenvy = "0.15.7"
mac6 = "1.2.0"
mac_address = "1.1.8"
#indicatif = "0.17.8"
serde_json = "1.0.145"
contour = "0.13.1"

[build-dependencies]
prost-build = "0.14.1"
