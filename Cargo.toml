[package]
name = "wtfps"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.86"
prost = "0.13.1"
bytes = "1.6.1"
reqwest = { version = "0.12.5", features = ["gzip"] }
h3o = "0.6.4"
mac_address = "1.1.7"
clap = { version = "4.5.9", features = ["derive"] }
tokio = { version = "1.38.0", features = ["full"] }
dotenvy = "0.15.7"
futures = "0.3.30"
rusqlite = { version = "0.31.0", features = ["bundled"] }

macn = { path = "../macn" }

[build-dependencies]
prost-build = "0.13.1"
