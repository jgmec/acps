[package]
name = "wtfps"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.86"
prost = "0.13.1"
reqwest = { version = "0.12.5", features = ["gzip"] }
h3o = { version = "0.6.4" }
clap = { version = "4.5.9", features = ["derive"] }
tokio = { version = "1.38.0", features = ["macros", "rt-multi-thread"] }
futures = "0.3.30"
rusqlite = { version = "0.31.0", features = ["bundled"] }
macn = { path = "../macn" }
tryhard = "0.5.1"
serde = { version = "1.0.204", features = ["derive"] }
zstd = "0.13.2"

[build-dependencies]
prost-build = "0.13.1"
