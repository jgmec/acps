# PostGIS database for wtfps. Data lives in the named volume postgis_data, so it survives
# `docker compose down` and container rebuilds; only `docker compose down -v` deletes it.
# The volume name is fixed (not prefixed with the project name), so a database started
# earlier with `docker run -v postgis_data:/var/lib/postgresql/data` is picked up as is.
# Never run that container and this service at the same time: two servers on one data
# directory can corrupt it.
#
#   docker compose up -d
#   DATABASE_URL=postgres://postgres:test@127.0.0.1:55432/wtfps   (in .env)
#   wtfps migrate
#
# Change the password before exposing the port beyond this machine.
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test}
      POSTGRES_DB: ${POSTGRES_DB:-wtfps}
    ports:
      # localhost only; set WTFPS_DB_PORT to use another host port
      - "127.0.0.1:${WTFPS_DB_PORT:-55432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      # over TCP: during first-start setup the image runs a temporary server on the Unix
      # socket only, which would otherwise report healthy too early
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgis_data:
    name: postgis_data
