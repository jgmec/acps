# PostGIS database for wtfps. Data lives in the named volume postgis_data, which is external:
# Compose uses it but never creates or deletes it, so the crawl survives `docker compose down`,
# `down -v` and rebuilds. Create it once before the first start:
#
#   docker volume create postgis_data
#
# A database started earlier with `docker run -v postgis_data:/var/lib/postgresql/data` is
# picked up as is. Never run that container and this service at the same time: two servers
# on one data directory can corrupt it.
#
#   docker compose up -d
#   DATABASE_URL=postgres://postgres:test@127.0.0.1:55432/wtfps   (in .env)
#   wtfps migrate
#
# Change the password before exposing the port beyond this machine.
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test}
      POSTGRES_DB: ${POSTGRES_DB:-wtfps}
    ports:
      # localhost only; set WTFPS_DB_PORT to use another host port
      - "127.0.0.1:${WTFPS_DB_PORT:-55432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      # over TCP: during first-start setup the image runs a temporary server on the Unix
      # socket only, which would otherwise report healthy too early
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # HTTP API: GET /cells/{mcc}/{mnc}/{tac}/{cell}/heatmap. Reachable from the LAN on
  # WTFPS_API_PORT; no authentication.
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-test}@db:5432/${POSTGRES_DB:-wtfps}
      RUST_LOG: ${RUST_LOG:-info}
      # elevation tiles for ?terrain=true, downloaded on first use (~40 MB per 1° square)
      WTFPS_DEM_DIR: /dem
      # external services: Apple's location service (and its server for China, used with
      # --china) and the Copernicus elevation tiles; change them e.g. for a proxy or mirror
      WTFPS_APPLE_URL: ${WTFPS_APPLE_URL:-https://gs-loc.apple.com/clls/wloc}
      WTFPS_APPLE_CHINA_URL: ${WTFPS_APPLE_CHINA_URL:-https://gs-loc-cn.apple.com/clls/wloc}
      WTFPS_DEM_URL: ${WTFPS_DEM_URL:-https://copernicus-dem-30m.s3.amazonaws.com}
    volumes:
      - dem:/dem
    ports:
      - "${WTFPS_API_PORT:-8090}:8090"

volumes:
  # a download cache of elevation tiles; safe to delete
  dem:
  postgis_data:
    external: true
    name: postgis_data
