// https://github.com/acheong08/apple-corelocation-experiments/blob/main/pb/BSSIDApple.proto

syntax = "proto3";

package apple;

message WifiDevice {
  string bssid = 1;
  optional Location location = 2;
}

message AppleWLoc {
  repeated WifiDevice wifi_devices = 2;

  repeated CellTower cell_tower_response = 22;
  optional CellTower cell_tower_request = 25;
}

message CellTower {
  uint32 mcc = 1;
  uint32 mnc = 2;
  uint32 cell_id = 3;
  uint32 tac_id = 4;
  optional Location location = 5;
  optional uint32 uarfcn = 6;
  optional uint32 pid = 7;
}

message Location {
  optional int64 latitude = 1;
  optional int64 longitude = 2;
  optional int64 horizontal_accuracy = 3;
  optional int64 altitude = 5;
  optional int64 vertical_accuracy = 6;
}
