// https://github.com/acheong08/apple-corelocation-experiments/blob/main/pb/BSSIDApple.proto

syntax = "proto3";

package apple;

message WifiDevice {
  string bssid = 1;
  optional Location location = 2;
}

message AppleWLoc {
  // 2G GSM and 3G UMTS cells: the same field for requests and replies. A reply holds only
  // the asked cells, without nearby cells or tracking-area estimates. Found by trying
  // request fields. (Field 27, answered in 23, has the same shape but is still unidentified:
  // 3G cells aren't found there.)
  repeated GsmCellTower gsm_cell_towers = 1;

  repeated WifiDevice wifi_devices = 2;

  repeated CellTower cell_tower_response = 22;
  repeated CellTower cell_tower_request = 25;

  // 5G NR cells, found by trying request fields (a 35-bit cell ID survives only here)
  repeated NrCellTower nr_cell_tower_response = 24;
  repeated NrCellTower nr_cell_tower_request = 29;
}

message CellTower {
  uint32 mcc = 1;
  uint32 mnc = 2;
  uint32 cell_id = 3;
  uint32 tac_id = 4;
  optional Location location = 5;
  optional uint32 uarfcn = 6;
  optional uint32 pid = 7;
}

// A 2G GSM or 3G UMTS cell: location area code (LAC) and cell ID: 16 bits (CI) for GSM,
// the full 28 bits for UMTS (RNC x 65536 + CID; the short CID alone isn't found). Fields 11
// and 12 are echoed as -1 for an unknown cell and were absent for known ones; they may be
// the channel and BSIC (GSM) or scrambling code (UMTS), unconfirmed.
message GsmCellTower {
  uint32 mcc = 1;
  uint32 mnc = 2;
  uint32 cell_id = 3;
  uint32 lac = 4;
  optional Location location = 5;
  optional uint32 unknown_11 = 11;
  optional uint32 unknown_12 = 12;
}

// A 5G NR cell: like CellTower, but with a 64-bit cell identity (NCI, 36 bits) and an
// NR-ARFCN as channel. Tracking-area estimates use cell_id -1 (u64::MAX), with an accuracy
// of 3000 instead of LTE's 149000. Apple hasn't sent field 7 (PCI) so far.
message NrCellTower {
  uint32 mcc = 1;
  uint32 mnc = 2;
  uint64 cell_id = 3;
  uint32 tac_id = 4;
  optional Location location = 5;
  optional uint32 nrarfcn = 6;
  optional uint32 pid = 7;
}

message Location {
  optional int64 latitude = 1;
  optional int64 longitude = 2;
  optional int64 horizontal_accuracy = 3;
  // undocumented; always 0 in cell replies
  optional int64 unknown_4 = 4;
  optional int64 altitude = 5;
  optional int64 vertical_accuracy = 6;
  // undocumented; ~940 for real cells, 1 for tracking-area estimates (version or age?)
  optional int64 unknown_11 = 11;
  // undocumented; varies widely and tracks horizontal_accuracy (finer accuracy? size?)
  optional int64 unknown_12 = 12;
}
