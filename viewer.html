<!doctype html>
<html lang="en">
  <head>
    <!-- <title>postcodes-au viewer</title> -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@4.1.3/dist/maplibre-gl.css"
    />
    <script src="https://unpkg.com/maplibre-gl@4.1.3/dist/maplibre-gl.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #map {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script>
      const map = new maplibregl.Map({
        container: "map",
        style: "https://cdn.joel.net.au/maps/black.json",
      });

      map.on("load", async () => {
        map.addSource("wtfps", {
          type: "vector",
          url: "https://cdn.joel.net.au/tiles/wtfps.json",
        });
        map.addLayer({
          id: "wtfps-wifi",
          type: "circle",
          source: "wtfps",
          "source-layer": "wifi",
          paint: {
            "circle-radius": 1.5,
            "circle-color": "#fcd34d",
          },
        });
      });
    </script>
  </body>
</html>
